<!DOCTYPE html>
<!-- search.html — Advanced search: live suggestions, filters, recent searches. -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث | بين السطور</title>
  <meta name="description" content="ابحث في مكتبة بين السطور مع اقتراحات حيّة وفلاتر للتصنيف واللغة والسعر.">
  <link rel="canonical" href="https://baynalsutoor.example/search.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="البحث | بين السطور">
  <meta property="og:description" content="ابحث عن كتابك بسهولة وسرعة.">
  <meta property="og:image" content="assets/images/banners/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="البحث | بين السطور">
  <meta name="twitter:description" content="ابحث عن كتابك بسهولة وسرعة.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script defer src="js/services/data-client.js"></script>
  <script defer src="js/services/book-service.js"></script>
  <script defer src="js/services/author-service.js"></script>
  <script defer src="js/services/review-service.js"></script>
  <script defer src="js/services/subscription-service.js"></script>
  <script defer src="js/language.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/search.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skipToContent">تخطٍّ إلى المحتوى</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container"><h1 data-i18n="nav.search">بحث</h1></div>
    </section>

    <section class="section">
      <div class="container">
        <div class="search-bar" style="max-width:720px;margin:0 auto 1.5rem;position:relative">
          <span class="search-icon" aria-hidden="true">🔎</span>
          <label class="visually-hidden" for="search-input" data-i18n="common.search">ابحث عن كتاب أو مؤلف...</label>
          <input class="input" id="search-input" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-suggestions" data-i18n-attr="placeholder:common.search" placeholder="ابحث عن كتاب أو مؤلف...">
          <ul class="suggestions" id="search-suggestions" role="listbox" aria-label="Suggestions"></ul>
        </div>

        <div class="toolbar" style="max-width:920px;margin:0 auto 2rem">
          <div class="field">
            <label for="search-category" data-i18n="filters.category">التصنيف</label>
            <select class="select" id="search-category"></select>
          </div>
          <div class="field">
            <label for="search-language" data-i18n="filters.language">اللغة</label>
            <select class="select" id="search-language">
              <option value="all" data-i18n="common.all">الكل</option>
              <option value="العربية">العربية</option>
              <option value="Arabic">Arabic</option>
            </select>
          </div>
          <div class="field">
            <label for="search-price"><span data-i18n="filters.priceRange">نطاق السعر</span> — <span id="search-price-label" data-i18n="common.all">الكل</span></label>
            <input type="range" id="search-price" min="50" max="150" step="10" value="150">
          </div>
        </div>

        <p id="search-count" style="text-align:center;color:var(--text-muted);margin-bottom:1.5rem"></p>
        <div class="grid grid-books" id="search-results" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
