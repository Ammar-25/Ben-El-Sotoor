<!DOCTYPE html>
<!-- login.html — Login / Register tabs + social auth (demo, front-end only). -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | بين السطور</title>
  <meta name="description" content="سجّل الدخول أو أنشئ حسابًا جديدًا في بين السطور للوصول إلى مكتبتك ومفضلتك.">
  <link rel="canonical" href="https://baynalsutoor.example/login.html">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:title" content="تسجيل الدخول | بين السطور">
  <meta property="og:description" content="ادخل إلى حسابك في بين السطور.">
  <meta property="og:image" content="assets/images/banners/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script defer src="js/services/data-client.js"></script>
  <script defer src="js/services/book-service.js"></script>
  <script defer src="js/services/author-service.js"></script>
  <script defer src="js/services/review-service.js"></script>
  <script defer src="js/services/subscription-service.js"></script>
  <script defer src="js/language.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skipToContent">تخطٍّ إلى المحتوى</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="section">
      <div class="container">
        <div class="auth-card">
          <div class="auth-tabs" role="tablist" aria-label="Auth">
            <button role="tab" data-tab="login" aria-selected="true" data-i18n="auth.login">تسجيل الدخول</button>
            <button role="tab" data-tab="register" aria-selected="false" data-i18n="auth.register">إنشاء حساب</button>
          </div>

          <!-- LOGIN -->
          <form id="login-form" novalidate>
            <div class="field">
              <label for="login-email" data-i18n="auth.email">البريد الإلكتروني</label>
              <input class="input" id="login-email" type="email" required autocomplete="email">
            </div>
            <div class="field">
              <label for="login-pass" data-i18n="auth.password">كلمة المرور</label>
              <input class="input" id="login-pass" type="password" required autocomplete="current-password">
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;font-size:.88rem">
              <label style="display:flex;gap:.4rem;align-items:center"><input type="checkbox"> <span data-i18n="auth.remember">تذكّرني</span></label>
              <a href="#" style="color:var(--brand)" data-i18n="auth.forgot">نسيت كلمة المرور؟</a>
            </div>
            <button class="btn btn-primary btn-block" type="submit" data-i18n="auth.loginBtn">دخول</button>
          </form>

          <!-- REGISTER -->
          <form id="register-form" hidden novalidate>
            <div class="field">
              <label for="reg-name" data-i18n="auth.name">الاسم الكامل</label>
              <input class="input" id="reg-name" type="text" required autocomplete="name">
            </div>
            <div class="field">
              <label for="reg-email" data-i18n="auth.email">البريد الإلكتروني</label>
              <input class="input" id="reg-email" type="email" required autocomplete="email">
            </div>
            <div class="field">
              <label for="reg-pass" data-i18n="auth.password">كلمة المرور</label>
              <input class="input" id="reg-pass" type="password" required autocomplete="new-password">
            </div>
            <div class="field">
              <label for="reg-confirm" data-i18n="auth.confirmPassword">تأكيد كلمة المرور</label>
              <input class="input" id="reg-confirm" type="password" required autocomplete="new-password">
            </div>
            <button class="btn btn-primary btn-block" type="submit" data-i18n="auth.registerBtn">تسجيل</button>
          </form>

          <div class="divider"><span data-i18n="auth.or">أو</span></div>
          <div style="display:flex;flex-direction:column;gap:.6rem">
            <button class="social-btn" data-social="Google"><span data-i18n="auth.google">المتابعة عبر جوجل</span></button>
            <button class="social-btn" data-social="Facebook"><span data-i18n="auth.facebook">المتابعة عبر فيسبوك</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
