<!DOCTYPE html>
<!-- categories.html — Category cards with counts + books under a category. -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التصنيفات | بين السطور</title>
  <meta name="description" content="استكشف تصنيفات الكتب في بين السطور: علوم، روايات، تطوير ذات، تاريخ، شعر، أعمال وأطفال.">
  <link rel="canonical" href="https://baynalsutoor.example/categories.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="التصنيفات | بين السطور">
  <meta property="og:description" content="اعثر على ما يناسب ذوقك من تصنيفات متنوعة.">
  <meta property="og:image" content="assets/images/banners/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="التصنيفات | بين السطور">
  <meta name="twitter:description" content="اعثر على ما يناسب ذوقك من تصنيفات متنوعة.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script defer src="js/services/data-client.js"></script>
  <script defer src="js/services/book-service.js"></script>
  <script defer src="js/services/author-service.js"></script>
  <script defer src="js/services/review-service.js"></script>
  <script defer src="js/services/subscription-service.js"></script>
  <script defer src="js/language.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/books.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skipToContent">تخطٍّ إلى المحتوى</a>
  <header id="site-header"></header>

  <main id="main" class="min-h-screen pt-28 pb-20" style="background: #F5EFE3; background-image: var(--paper-texture);">
      <div class="max-w-7xl mx-auto px-6">
        
        <div class="mb-10 text-center">
            <div class="flex items-center justify-center gap-4 mb-4">
                <div class="h-px w-16" style="background: linear-gradient(to right, transparent, #B88A3B)"></div>
                <div style="color: #B88A3B; font-size: 1.2rem;">✦</div>
                <div class="h-px w-16" style="background: linear-gradient(to left, transparent, #B88A3B)"></div>
            </div>
            <h1 class="mb-2" style="font-family: var(--font-heading); font-size: clamp(1.8rem,4vw,3rem); color: #4A2E1A;" data-i18n="sections.categories">تصفّح حسب التصنيف</h1>
            <p style="font-family: var(--font); color: #8A6848; font-size: 1.1rem;" data-i18n="sections.categoriesSub">اعثر على ما يناسب ذوقك</p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-4 mb-16" id="categories-grid"><div class="spinner mx-auto col-span-full"></div></div>

        <div id="category-books-section" class="hidden">
            <div class="flex items-center gap-4 mb-8">
                <div class="h-px flex-1" style="background: linear-gradient(to right, transparent, #B88A3B)"></div>
                <h2 id="category-books-title" style="font-family: var(--font-heading); color: #2A1A0E; font-size: 1.6rem; white-space: nowrap;">…</h2>
                <div class="h-px flex-1" style="background: linear-gradient(to left, transparent, #B88A3B)"></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="category-books" aria-live="polite"></div>
        </div>
      </div>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
