<!DOCTYPE html>
<!-- library.html — Full catalog with category filters, sort, search, pagination. -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المكتبة | بين السطور</title>
  <meta name="description" content="تصفّح مكتبة بين السطور الكاملة: فلترة حسب التصنيف، ترتيب حسب السعر والتقييم، وبحث سريع عن كتابك المفضل.">
  <link rel="canonical" href="https://baynalsutoor.example/library.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="المكتبة | بين السطور">
  <meta property="og:description" content="تصفّح آلاف الكتب وفلترها حسب ذوقك.">
  <meta property="og:image" content="assets/images/banners/og-cover.png">
  <meta property="og:url" content="https://baynalsutoor.example/library.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="المكتبة | بين السطور">
  <meta name="twitter:description" content="تصفّح آلاف الكتب وفلترها حسب ذوقك.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Scripts: services → i18n/theme → store → ui → bootstrap (all deferred, ordered) -->
  <script defer src="js/services/auth-service.js"></script>
  <script defer src="js/services/data-client.js"></script>
  <script defer src="js/services/book-service.js"></script>
  <script defer src="js/services/author-service.js"></script>
  <script defer src="js/services/review-service.js"></script>
  <script defer src="js/services/subscription-service.js"></script>
  <script defer src="js/language.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/books.js"></script>
  <link rel="icon" type="image/png" href="assets/images/ui/logo-placeholder.png">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skipToContent">تخطٍّ إلى المحتوى</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="nav.library">المكتبة</h1>
        <p data-i18n="sections.featuredSub">أبرز الإصدارات التي ينصح بها قراؤنا</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar">
          <div class="field" style="flex:2">
            <label for="library-search" data-i18n="common.search">ابحث عن كتاب أو مؤلف...</label>
            <div class="search-bar">
              <span class="search-icon" aria-hidden="true">🔎</span>
              <input class="input" id="library-search" type="search" data-i18n-attr="placeholder:common.search" placeholder="ابحث...">
            </div>
          </div>
          <div class="field">
            <label for="library-sort" data-i18n="common.sortBy">ترتيب حسب</label>
            <select class="select" id="library-sort">
              <option value="newest" data-i18n="sort.newest">الأحدث</option>
              <option value="priceLow" data-i18n="sort.priceLow">السعر: من الأقل</option>
              <option value="priceHigh" data-i18n="sort.priceHigh">السعر: من الأعلى</option>
              <option value="rating" data-i18n="sort.rating">الأعلى تقييمًا</option>
            </select>
          </div>
        </div>

        <div class="chips" id="library-chips" role="group" aria-label="Categories" style="margin-bottom:1rem"></div>
        <p id="library-count" style="color:var(--text-muted);margin-bottom:1rem"></p>

        <div class="grid grid-books" id="library-grid" aria-live="polite"><div class="spinner"></div></div>
        <div class="chips" id="library-pager" style="justify-content:center;margin-top:2.5rem"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
