<!DOCTYPE html>
<!-- reviews.html — Overall rating, breakdown, user reviews, review form. -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقييمات | بين السطور</title>
  <meta name="description" content="تقييمات ومراجعات قرّاء بين السطور: التقييم العام، توزيع النجوم، وأضف مراجعتك الخاصة.">
  <link rel="canonical" href="https://baynalsutoor.example/reviews.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="التقييمات | بين السطور">
  <meta property="og:description" content="ماذا قال قراؤنا عن كتبنا.">
  <meta property="og:image" content="assets/images/banners/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="التقييمات | بين السطور">
  <meta name="twitter:description" content="ماذا قال قراؤنا عن كتبنا.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/pages/inner.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script defer src="js/services/data-client.js"></script>
  <script defer src="js/services/book-service.js"></script>
  <script defer src="js/services/author-service.js"></script>
  <script defer src="js/services/review-service.js"></script>
  <script defer src="js/services/subscription-service.js"></script>
  <script defer src="js/language.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
  <link rel="icon" type="image/png" href="assets/images/ui/logo-placeholder.png">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skipToContent">تخطٍّ إلى المحتوى</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container"><h1 data-i18n="reviews.title">التقييمات والمراجعات</h1></div>
    </section>

    <section class="section">
      <div class="container" id="reviews-root">
        <div class="reviews-summary" id="reviews-summary"></div>

        <div class="grid" style="grid-template-columns:1.4fr .9fr;gap:2rem;align-items:start">
          <div>
            <div class="section-head" style="text-align:start;margin-bottom:1rem"><h2 style="font-size:1.3rem" data-i18n="reviews.userReviews">آراء القراء</h2></div>
            <div id="reviews-list">
              <div class="spinner"></div>
            </div>
          </div>

          <!-- Review form -->
          <aside class="auth-card" style="margin:0">
            <h3 style="margin-bottom:1rem" data-i18n="reviews.writeReview">اكتب مراجعة</h3>
            <form id="review-form" novalidate>
              <div class="field">
                <label data-i18n="reviews.yourRating">تقييمك</label>
                <div class="rating-input">
                  <input type="radio" id="r5" name="rating" value="5" checked><label for="r5">★</label>
                  <input type="radio" id="r4" name="rating" value="4"><label for="r4">★</label>
                  <input type="radio" id="r3" name="rating" value="3"><label for="r3">★</label>
                  <input type="radio" id="r2" name="rating" value="2"><label for="r2">★</label>
                  <input type="radio" id="r1" name="rating" value="1"><label for="r1">★</label>
                </div>
              </div>
              <div class="field">
                <label for="review-text" data-i18n="reviews.yourReview">رأيك</label>
                <textarea class="textarea" id="review-text" name="review" required></textarea>
              </div>
              <button class="btn btn-primary btn-block" type="submit" data-i18n="reviews.submit">إرسال المراجعة</button>
            </form>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
